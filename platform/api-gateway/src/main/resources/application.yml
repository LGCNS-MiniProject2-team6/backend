server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  profiles:
    default: local
  config:
    import:
      - classpath:bus.yml
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      label: ${CONFIG_GIT_LABEL:main}
      username: ${CONFIG_USER:}
      password: ${CONFIG_PASSWORD:}
    gateway:
      default-filters:
        - RemoveRequestHeader=userId
      routes:
        - id: auth-logout
          order: -20
          uri: lb://user-service
          predicates:
            - Path=/api/auth/logout
            - Method=POST
          filters:
            - JwtValidation
            - JwtUserId
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth,/api/auth/**
        - id: user-profile
          uri: lb://user-service
          predicates:
            - Path=/api/profile
            - Method=GET,POST,PUT
          filters:
            - JwtValidation
            - JwtUserId
        - id: user-bookmarks
          uri: lb://user-service
          predicates:
            - Path=/api/bookmarks,/api/bookmarks/*
            - Method=GET,POST,DELETE
          filters:
            - JwtValidation
            - JwtUserId
        - id: user-service-other
          order: 10
          uri: lb://user-service
          predicates:
            - Path=/api/profile/**,/api/bookmarks/**
        - id: user-notifications
          uri: lb://user-service
          predicates:
            - Path=/api/notifications,/api/notifications/**
          filters:
            - JwtValidation
            - JwtUserId
        - id: ai-service
          order: -10
          uri: lb://ai-service
          predicates:
            - Path=/api/posts/*/guide
            - Method=POST
          filters:
            - JwtValidation
            - JwtUserId
        - id: blog-user-context
          order: -5
          uri: lb://blog-service
          predicates:
            - Path=/api/posts/*,/api/companies,/api/companies/*/posts
            - Method=GET
          filters:
            - JwtValidation
            - JwtUserId
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/api/posts,/api/posts/**,/api/companies,/api/companies/**,/api/tech-tags,/api/tech-tags/**


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

jwt:
  secret: ${JWT_SECRET:default-secret-key-must-be-very-long-and-secure-at-least-256-bits-for-hmac-sha}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.gateway: DEBUG