server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  profiles:
    default: local
  config:
    import:
      - classpath:bus.yml
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      label: ${CONFIG_GIT_LABEL:main}
      username: ${CONFIG_USER:}
      password: ${CONFIG_PASSWORD:}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
