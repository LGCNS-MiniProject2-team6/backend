server:
  port: ${SERVER_PORT:8888}
  shutdown: graceful

spring:
  config:
    import: classpath:bus.yml
  application:
    name: config-server
  security:
    user:
      name: ${CONFIG_USER}
      password: ${CONFIG_PASSWORD}
  cloud:
    config:
      server:
        accept-empty: false
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/LGCNS-MiniProject2-team6/recu-config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          try-master-branch: false
          clone-on-start: true
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_TOKEN:}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

config:
  management:
    username: ${CONFIG_ADMIN_USER:}
    password: ${CONFIG_ADMIN_PASSWORD:}

# Config에만 주입하는 암호화 키. Git에 실값을 기록하지 않는다.
encrypt:
  key: ${ENCRYPT_KEY}
