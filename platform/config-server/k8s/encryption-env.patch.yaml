# 기존 Deployment에 병합하는 patch다. 단독 apply용 전체 Deployment가 아니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: recu-dev
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: config-encryption
                  key: ENCRYPT_KEY
            - name: CONFIG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: config-encryption
                  key: CONFIG_ADMIN_USER
                  optional: true
            - name: CONFIG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-encryption
                  key: CONFIG_ADMIN_PASSWORD
                  optional: true
