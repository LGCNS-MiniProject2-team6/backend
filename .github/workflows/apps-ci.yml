name: Apps CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: discovery-server
            module: platform/discovery-server
            image: recu-discoveryserver
            bus: false
          - name: config-server
            module: platform/config-server
            image: recu-configserver
            bus: true
          - name: api-gateway
            module: platform/api-gateway
            image: recu-apigateway
            bus: true
          - name: user-service
            module: services/user-service
            image: recu-userservice
            bus: true
          - name: ai-service
            module: services/ai-service
            image: recu-aiservice
            bus: true
          - name: blog-service
            module: services/blog-service
            image: recu-blogservice
            bus: true

    env:
      MODULE: ${{ matrix.module }}
      IMAGE: docker.io/junwooqkr5302/${{ matrix.image }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected app
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          USES_BUS: ${{ matrix.bus }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --no-renames "$PR_BASE"...HEAD > changed-files.txt
          elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only --no-renames "$PUSH_BASE" HEAD > changed-files.txt
          fi

          affected=false
          while IFS= read -r path; do
            case "$path" in
              "$MODULE"/*)
                affected=true
                ;;
              build.gradle|settings.gradle|gradle.properties|gradlew|gradlew.bat|gradle/*|buildSrc/*|.github/workflows/apps-ci.yml|scripts/update-gitops-image.py)
                affected=true
                ;;
              platform/bus-support/*)
                if [[ "$USES_BUS" == "true" ]]; then
                  affected=true
                fi
                ;;
            esac
          done < changed-files.txt

          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "$MODULE: affected=$affected" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        if: steps.changes.outputs.affected == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test GitOps image updater
        run: python3 scripts/test_update_gitops_image.py

      - name: Test and build JAR
        if: steps.changes.outputs.affected == 'true'
        env:
          USES_BUS: ${{ matrix.bus }}
        shell: bash
        run: |
          set -euo pipefail
          task=":${MODULE//\//:}"

          if [[ "$USES_BUS" == "true" ]]; then
            bash ./gradlew --no-daemon \
              :platform:bus-support:test \
              "${task}:test" "${task}:bootJar"
          else
            bash ./gradlew --no-daemon \
              "${task}:test" "${task}:bootJar"
          fi

      - name: Build image
        if: steps.changes.outputs.affected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" "$MODULE"

      - name: Login to Docker Hub
        if: >-
          steps.changes.outputs.affected == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: >-
          steps.changes.outputs.affected == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout GitOps
        if: steps.changes.outputs.affected == 'true' && github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GITOPS_REPOSITORY || 'LGCNS-MiniProject2-team6/recu-gitops' }}
          ref: ${{ vars.GITOPS_BASE_BRANCH || 'main' }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false

      - name: Update dev image and record digest
        if: steps.changes.outputs.affected == 'true' && github.event_name == 'push'
        env:
          SERVICE: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-gitops-image.py gitops "$SERVICE" "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '# 수정사항'
            echo "- dev $SERVICE 이미지: $IMAGE"
            echo "- Digest: $digest"
            echo '# 메모'
            echo "- Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "- CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '- 역할 2 검토·병합 후 dev 배포 상태 확인 필요'
            echo '- AI로 작성한 GitOps 태그 변경 자동화에서 생성'
          } > "$RUNNER_TEMP/gitops-pr-${SERVICE}.md"

      - name: Create or update dev image PR
        if: steps.changes.outputs.affected == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: ${{ vars.GITOPS_BASE_BRANCH || 'main' }}
          branch: codex/dev-image-${{ matrix.name }}-${{ github.sha }}
          add-paths: overlays/dev-apps/images/${{ matrix.name }}.json
          commit-message: 'chore(gitops): dev ${{ matrix.name }} 이미지 갱신'
          title: 'chore(gitops): dev ${{ matrix.name }} 이미지 갱신'
          body-path: ${{ runner.temp }}/gitops-pr-${{ matrix.name }}.md
