# 환경별 토픽 목록. create-topics.sh <환경> 이 해당 환경 줄만 생성한다.
# 공백 구분: 환경 토픽 파티션 복제수 retention.ms
# - 브로커 1대이므로 복제수는 1
# - 파티션은 늘릴 수만 있고 늘리면 Key 순서가 바뀌므로 처음 값을 신중히 정한다

# Spring Cloud Bus 설정 갱신 이벤트. 일시 신호라 1일 보관
local recu-config-bus-local 1 1 86400000
dev   recu-config-bus-dev   1 1 86400000
prod  recu-config-bus-prod  1 1 86400000

# 블로그 도메인 이벤트 (#61). 환경별 브로커가 분리되어 있어 이름에 환경 접미사를 붙이지 않는다.
# - requested: 내부 blog-service 발행/소비, Key = 글 url
# - created:   blog-service 발행, Key = postId
# - *-dlt: Spring Kafka DeadLetterPublishingRecoverer 기본 접미사. 원본과 같은 파티션 번호로 보내므로 파티션 수를 원본과 같게 둔다
# 보관: 본 토픽 7일(604800000), DLT 14일(1209600000)
local blog-post.requested.v1     3 1 604800000
local blog-post.created.v1       3 1 604800000
local blog-post.requested.v1-dlt 3 1 1209600000
local blog-post.created.v1-dlt   3 1 1209600000
dev   blog-post.requested.v1     3 1 604800000
dev   blog-post.created.v1       3 1 604800000
dev   blog-post.requested.v1-dlt 3 1 1209600000
dev   blog-post.created.v1-dlt   3 1 1209600000
prod  blog-post.requested.v1     3 1 604800000
prod  blog-post.created.v1       3 1 604800000
prod  blog-post.requested.v1-dlt 3 1 1209600000
prod  blog-post.created.v1-dlt   3 1 1209600000
