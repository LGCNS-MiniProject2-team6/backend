plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'   // 코드 모양 통일. 프론트의 prettier 자리
}

// 코드 모양을 구글 표준으로 맞춘다.
//   ./gradlew spotlessApply   고치기
//   ./gradlew spotlessCheck   검사만 (pre-commit 훅이 부른다)
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.17.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

group = 'com.mini8'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web · jpa · security · validation (수업과 동일)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서 (수업: springdoc 2.7.0 = Boot 3.4 짝)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // JWT (수업 코드가 쓰는 0.11 API: parserBuilder)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // DB: MariaDB. 표는 JPA 엔티티(database/entity)에서 ddl-auto 로 만든다 (Flyway 안 씀, 09-21 결정)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 수집: RSS 피드와 글 본문 HTML 을 읽는다 (features/collect)
    // Spring Boot 가 버전을 관리하지 않는 라이브러리라 버전을 직접 적는다
    implementation 'org.jsoup:jsoup:1.21.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'   // 테스트만 H2. MariaDB 없이도 gradlew test 가능
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'   // Windows 기본이 MS949 라 한글 문자열 깨짐 방지
}

// 돌 때도 UTF-8 로 읽는다. JDK 17 은 파일을 읽을 때 Windows 기본(MS949)을 쓰기 때문에
// .env 에 적은 한글 경로나 한글이 든 파일이 깨진다 (09-22 적재에서 실측)
tasks.withType(JavaExec) {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
}
tasks.withType(Test) {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
}

tasks.named('test') {
    // 실제 블로그에 요청하는 테스트는 평소에 건너뛴다. 인터넷 상태에 따라 남의 빌드가 깨지기 때문.
    //   ./gradlew test            받아 둔 파일로만 (빠름)
    //   ./gradlew test -Pnetwork  여덟 곳에 실제 요청 (사이트 개편 확인용)
    useJUnitPlatform {
        if (!project.hasProperty('network')) {
            excludeTags 'network'
        }
    }
    testLogging {
        showStandardStreams = true   // 테스트가 찍는 값을 터미널에 그대로 보여준다
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
