server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  config:
    import: classpath:bus.yml
  application:
    name: user-service
  profiles:
    default: local
  cloud:
    config:
      label: ${CONFIG_GIT_LABEL:main}
      username: ${CONFIG_USER:}
      password: ${CONFIG_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka/Probe 기본값은 독립 진단용이며 환경별 중앙 설정으로 덮어쓸 수 있다.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: "!standalone"
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}

---
# Config 연결 자체를 제외하는 로컬 장애 분리용 명시적 프로필
spring:
  config:
    activate:
      on-profile: standalone
  cloud:
    config:
      enabled: false
