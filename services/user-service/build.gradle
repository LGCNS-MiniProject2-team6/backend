apply from: '../../gradle/msa-common.gradle'

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // web · jpa · security · validation (수업과 동일)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서 (수업: springdoc 2.7.0 = Boot 3.4 짝)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // JWT (수업 코드가 쓰는 0.11 API: parserBuilder)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // DB: MariaDB. 표는 JPA 엔티티(database/entity)에서 ddl-auto 로 만든다 (Flyway 안 씀, 09-21 결정)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 수집: RSS 피드와 글 본문 HTML 을 읽는다 (features/collect)
    // Spring Boot 가 버전을 관리하지 않는 라이브러리라 버전을 직접 적는다
    implementation 'org.jsoup:jsoup:1.21.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'   // 테스트만 H2. MariaDB 없이도 gradlew test 가능
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply from: '../../gradle/msa-bus.gradle'
