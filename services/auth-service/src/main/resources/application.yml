server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  config:
    import: classpath:bus.yml
  application:
    name: auth-service
  profiles:
    default: local
  cloud:
    config:
      label: ${CONFIG_GIT_LABEL:main}
      username: ${CONFIG_USER:}
      password: ${CONFIG_PASSWORD:}

# Eureka/Probe 기본값은 독립 진단용이며 환경별 중앙 설정으로 덮어쓸 수 있다.
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: "!standalone"
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}

---
# Config 연결 자체를 제외하는 로컬 장애 분리용 명시적 프로필
spring:
  config:
    activate:
      on-profile: standalone
  cloud:
    config:
      enabled: false
