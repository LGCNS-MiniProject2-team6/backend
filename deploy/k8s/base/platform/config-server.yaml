apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/component: platform
    spec:
      nodeSelector:
        workload: platform
      containers:
        - name: app
          image: registry.invalid/recu/config-server:replace-me
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: platform-runtime
          env:
            - name: SERVER_PORT
              value: "8888"
            - name: CONFIG_USER
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_USER
            - name: CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_PASSWORD
            - name: CONFIG_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_GIT_USERNAME
            - name: CONFIG_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_GIT_TOKEN
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: ENCRYPT_KEY
            - name: CONFIG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_ADMIN_USER
                  optional: true
            - name: CONFIG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: CONFIG_ADMIN_PASSWORD
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 36
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app.kubernetes.io/name: config-server
  ports:
    - name: http
      port: 8888
      targetPort: http
