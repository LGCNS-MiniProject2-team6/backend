apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recu-prod
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: db-runtime
    literals:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb.recu-prod.svc.cluster.local:3306/user_service
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      - SPRING_DATASOURCE_USERNAME=user_service
      - DB_URL=jdbc:mariadb://mariadb.recu-prod.svc.cluster.local:3306
      - DB_USER=ai_service
      - BLOG_DB_URL=jdbc:mariadb://mariadb.recu-prod.svc.cluster.local:3306/blog_service
      - BLOG_DB_USER=blog_service
  - name: bus-runtime
    literals:
      - BUS_ENABLED=true
      - BUS_DESTINATION=recu-config-bus-prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka.recu-prod.svc.cluster.local:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
  - name: kafka-broker
    envs:
      - kafka-broker.env
  - name: platform-runtime
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - CONFIG_GIT_URI=https://github.com/LGCNS-MiniProject2-team6/recu-config.git
      - CONFIG_GIT_LABEL=main
      - FRONTEND_ORIGIN=https://replace-with-prod-frontend-origin.invalid
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored-by-target-selector
      spec:
        template:
          spec:
            nodeSelector:
              environment: prod
